<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Attendance sync</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 22px;
           color: #1a1a1a; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    p { margin: 0 0 10px; color: #555; font-size: 13px; }
    .ok { color: #2e7d32; } .err { color: #c62828; }
    #ids { width: 100%; box-sizing: border-box; font: 13px/1.5 ui-monospace, monospace;
           padding: 10px; border: 1px solid #bbb; border-radius: 6px; height: 90px; }
    button { font: 13px system-ui, sans-serif; padding: 8px 14px; border-radius: 6px;
             border: 1px solid #bbb; background: #f4f4f4; cursor: pointer; }
    #manual { display: none; }
    ol { margin: 8px 0 0; padding-left: 20px; color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Attendance sync</h1>
  <p id="status">Working…</p>

  <div id="manual">
    <textarea id="ids" readonly></textarea>
    <p style="margin-top:10px;">
      <button id="copy">Copy list</button>
      <span id="copied" class="ok"></span>
    </p>
    <ol>
      <li>Switch back to the PeopleSoft roster tab.</li>
      <li>Paste this list into the box it shows you.</li>
      <li>Check the grid, then click <b>Save</b> yourself.</li>
    </ol>
  </div>

  <script>
    /* Opened by the bookmarklet. TAFE's CSP stops the roster page calling this
       app directly, so the work happens here instead. We try to postMessage the
       result straight back, but the roster page's COOP may have severed the
       opener link — so the list is always shown for copying by hand. */
    var PS = {{ ps_origin|tojson }};
    var API = {{ api_base|tojson }};

    var statusEl = document.getElementById('status');
    var manual = document.getElementById('manual');
    var idsEl = document.getElementById('ids');

    function say(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }

    function tell(payload) {
      if (!window.opener) { return false; }
      try { window.opener.postMessage(payload, PS); return true; }
      catch (e) { return false; }
    }

    function asJson(r) {
      if (r.status === 409) {
        return r.json().then(function (j) {
          throw new Error(j.message || 'That roster belongs to a different class.');
        });
      }
      if (!r.ok) { throw new Error('HTTP ' + r.status + ' from the attendance app'); }
      return r.json();
    }

    /* Always shown. If the roster page also receives the postMessage it closes
       this window itself — but we never assume that worked, because a silently
       dropped message would otherwise leave nothing to copy. */
    function showList(emplids, note, day) {
      idsEl.value = emplids.join(', ');
      manual.style.display = 'block';
      say(emplids.length
        ? emplids.length + ' present on ' + day + ' — paste this into the roster page.'
        : 'Nobody is marked present for ' + day + ' in the attendance app.',
        emplids.length ? '' : 'err');
      if (note) {
        var p = document.createElement('p');
        p.textContent = note;
        manual.appendChild(p);
      }
      idsEl.focus();
      idsEl.select();
      if (navigator.clipboard && emplids.length) {
        navigator.clipboard.writeText(idsEl.value).then(function () {
          document.getElementById('copied').textContent = 'Copied to clipboard.';
        }, function () {
          document.getElementById('copied').textContent = 'Press Ctrl+C to copy.';
        });
      }
    }

    document.getElementById('copy').addEventListener('click', function () {
      idsEl.select();
      var done = function () {
        document.getElementById('copied').textContent = 'Copied.';
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(idsEl.value).then(done, function () {
          document.execCommand('copy'); done();
        });
      } else { document.execCommand('copy'); done(); }
    });

    var payload;
    try {
      payload = JSON.parse(decodeURIComponent(
        (location.search.match(/[?&]p=([^&]*)/) || [])[1] || ''));
    } catch (e) { payload = null; }

    if (!payload || !payload.date) {
      say('Open this from the Attendance bookmark on a PeopleSoft roster page.', 'err');
    } else {
      say('Matching students…');
      fetch(API + '/roster', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          rows: payload.rows || [], class_nbr: payload.class_nbr || '',
          related: payload.related || [], strm: payload.strm || '',
          label: payload.label || ''
        })
      }).then(asJson).then(function (learn) {
        return fetch(API + '/present?date=' + encodeURIComponent(payload.date)
               + '&class_nbr=' + encodeURIComponent(payload.class_nbr || '')
               + '&related=' + encodeURIComponent((payload.related || []).join(',')))
          .then(asJson).then(function (data) {
            var note = data.klass ? ('Attendance app class: ' + data.klass + '. ') : '';
            if (learn.linked_now) {
              note += 'Now linked to PeopleSoft class ' + learn.linked_now +
                ' — check that is right. ';
            }
            if (learn.unknown && learn.unknown.length) {
              note += learn.unknown.length + ' student(s) on this roster are not in your app. ';
            }
            if (learn.conflicts && learn.conflicts.length) {
              note += 'ID conflicts: ' + learn.conflicts.join(', ') + '. ';
            }
            if (data.missing_emplid && data.missing_emplid.length) {
              note += 'No ID yet for: ' + data.missing_emplid.join(', ') + '.';
            }
            showList(data.emplids || [], note, payload.date);
            tell({
              type: 'result', emplids: data.emplids || [],
              missing_emplid: data.missing_emplid || [], learn: learn,
              klass: data.klass || ''
            });
          });
      }).catch(function (err) {
        var message = String(err.message || err);
        say(message, 'err');
        tell({ type: 'error', message: message });
      });
    }
  </script>
</body>
</html>

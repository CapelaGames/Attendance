<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAFE NSW — Attendance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0f1117;
      --surface:      #1a1d27;
      --border:       #2a2e3f;
      --accent:       #4f8ef7;
      --green-bg:     #0a2118;
      --green-border: #2ea84a;
      --green-text:   #5dde80;
      --text:         #e8eaf0;
      --muted:        #6b7280;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .brand .sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .date-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 7px 13px;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
      font-family: inherit;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { border-color: var(--accent); color: var(--accent); }

    /* ── Search ── */
    .search-wrap { padding: 20px 28px 8px; }
    input[type="search"] {
      width: 100%;
      padding: 15px 20px;
      font-size: 1.2rem;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    input[type="search"]:focus { border-color: var(--accent); }
    input[type="search"]::placeholder { color: var(--muted); }

    /* ── Stats ── */
    .stats {
      padding: 8px 28px;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 28px;
    }
    .stats b { color: var(--green-text); }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      padding: 8px 28px 36px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 22px 14px 18px;
      cursor: pointer;
      text-align: center;
      user-select: none;
      transition: transform 0.12s, border-color 0.15s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card:active { transform: scale(0.96); }
    .card.present { background: var(--green-bg); border-color: var(--green-border); }
    .card.present:hover { border-color: #4dce6a; }

    .card-icon { font-size: 1.8rem; margin-bottom: 9px; }
    .card-name { font-size: 1rem; font-weight: 600; line-height: 1.3; margin-bottom: 5px; }
    .card-status { font-size: 0.78rem; font-weight: 500; }
    .card:not(.present) .card-status { color: var(--muted); }
    .card.present .card-status { color: var(--green-text); }

    /* ── No results ── */
    .no-results {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty h2 { font-size: 1.2rem; margin-bottom: 10px; color: var(--text); }
    .empty p { font-size: 0.9rem; margin-bottom: 20px; line-height: 1.6; }

    /* ── Add students panel ── */
    #add-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #add-panel.open { display: flex; }
    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
    }
    .panel-box h2 { font-size: 1.1rem; margin-bottom: 8px; }
    .panel-box p { font-size: 0.82rem; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
    .panel-box textarea {
      width: 100%;
      height: 180px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      padding: 12px;
      resize: vertical;
      outline: none;
    }
    .panel-box textarea:focus { border-color: var(--accent); }
    .panel-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      color: var(--green-text);
      padding: 13px 26px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s;
      opacity: 0;
      z-index: 100;
      white-space: nowrap;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.warn { background: #1a1020; border-color: #7c4dff; color: #b39ddb; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <h1>TAFE NSW — Attendance</h1>
    <div class="sub">Tap your name to mark yourself present</div>
  </div>
  <div class="header-right">
    <div class="date-pill" id="date-display">—</div>
    <button class="btn" onclick="openAddPanel()">+ Add Students</button>
    <a href="/sheet" class="btn" target="_blank">View Sheet</a>
  </div>
</header>

<div class="search-wrap">
  <input type="search" id="search" placeholder="Search your name…" autocomplete="off">
</div>

<div class="stats" id="stats"></div>
<div class="grid" id="grid"></div>

<!-- Add students panel -->
<div id="add-panel">
  <div class="panel-box">
    <h2>Add Students</h2>
    <p>Paste or type student names, one per line.<br>Students already in the list will be skipped.</p>
    <textarea id="names-input" placeholder="Jane Smith&#10;John Doe&#10;..."></textarea>
    <div class="panel-actions">
      <button class="btn" onclick="closeAddPanel()">Cancel</button>
      <button class="btn primary" onclick="submitNames()">Add to class list</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let state = { students: [], today: '' };
  let toastTimer;

  // ── Fetch state & render ──────────────────────────────────────
  async function init() {
    try {
      state = await fetch('/api/state').then(r => r.json());
    } catch {
      showToast('Could not connect to server', 'warn');
      return;
    }
    document.getElementById('date-display').textContent = state.today;
    renderGrid(state.students);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderGrid(students) {
    const grid = document.getElementById('grid');
    const q = document.getElementById('search').value.trim().toLowerCase();

    if (students.length === 0) {
      grid.innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <h2>No students yet</h2>
          <p>Click <strong>+ Add Students</strong> in the top-right<br>to add your class list.</p>
        </div>`;
      updateStats([]);
      return;
    }

    grid.innerHTML = '';
    const noRes = document.createElement('div');
    noRes.className = 'no-results';
    noRes.id = 'no-results';
    noRes.textContent = 'No student found — check your spelling.';
    grid.appendChild(noRes);

    let visible = 0;
    students.forEach(s => {
      const matches = !q || s.name.toLowerCase().includes(q);
      const card = document.createElement('div');
      card.className = 'card' + (s.present ? ' present' : '');
      card.dataset.index = s.index;
      card.dataset.name = s.name.toLowerCase();
      card.style.display = matches ? '' : 'none';
      if (matches) visible++;

      card.innerHTML = `
        <div class="card-icon">${s.present ? '✓' : '○'}</div>
        <div class="card-name">${escHtml(s.name)}</div>
        <div class="card-status">${s.present ? 'Present' : 'Not marked'}</div>
      `;
      card.addEventListener('click', () => markStudent(s.index, card, s));
      grid.appendChild(card);
    });

    noRes.style.display = visible === 0 ? 'block' : 'none';
    updateStats(students);
  }

  function updateStats(students) {
    const el = document.getElementById('stats');
    if (!students || students.length === 0) { el.textContent = ''; return; }
    const cards = document.querySelectorAll('.card');
    const visibleCards = Array.from(cards).filter(c => c.style.display !== 'none');
    const presentCount = visibleCards.filter(c => c.classList.contains('present')).length;
    const total = visibleCards.length;
    const all = students.length;
    if (total < all) {
      el.innerHTML = `Showing ${total} of ${all} students &nbsp;·&nbsp; <b>${presentCount}</b> present`;
    } else {
      el.innerHTML = `${all} students &nbsp;·&nbsp; <b>${presentCount}</b> present today`;
    }
  }

  // ── Mark attendance ───────────────────────────────────────────
  async function markStudent(index, card, studentRef) {
    card.style.pointerEvents = 'none';
    try {
      const res = await fetch('/api/mark', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index})
      });
      const data = await res.json();
      studentRef.present = data.present;

      card.classList.toggle('present', data.present);
      card.querySelector('.card-icon').textContent = data.present ? '✓' : '○';
      card.querySelector('.card-status').textContent = data.present ? 'Present' : 'Not marked';

      updateStats(state.students);
      if (data.present) {
        showToast('✓  ' + studentRef.name + ' — marked present');
      } else {
        showToast('Unmarked: ' + studentRef.name, 'warn');
      }
    } catch {
      showToast('Error — please try again', 'warn');
    }
    card.style.pointerEvents = '';
  }

  // ── Search ────────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    const cards = document.querySelectorAll('.card');
    let visible = 0;
    cards.forEach(c => {
      const match = !q || c.dataset.name.includes(q);
      c.style.display = match ? '' : 'none';
      if (match) visible++;
    });
    const noRes = document.getElementById('no-results');
    if (noRes) noRes.style.display = visible === 0 ? 'block' : 'none';
    updateStats(state.students);
  });

  // ── Add students panel ────────────────────────────────────────
  function openAddPanel() {
    document.getElementById('add-panel').classList.add('open');
    document.getElementById('names-input').focus();
  }
  function closeAddPanel() {
    document.getElementById('add-panel').classList.remove('open');
    document.getElementById('names-input').value = '';
  }
  document.getElementById('add-panel').addEventListener('click', e => {
    if (e.target === document.getElementById('add-panel')) closeAddPanel();
  });

  async function submitNames() {
    const raw = document.getElementById('names-input').value;
    const names = raw.split('\n').map(n => n.trim()).filter(Boolean);
    if (!names.length) return;

    try {
      const res = await fetch('/api/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({names})
      });
      const data = await res.json();
      closeAddPanel();
      state = await fetch('/api/state').then(r => r.json());
      renderGrid(state.students);
      showToast(`Added ${data.added.length} student${data.added.length !== 1 ? 's' : ''}`);
    } catch {
      showToast('Error saving — try again', 'warn');
    }
  }

  // ── Toast ─────────────────────────────────────────────────────
  function showToast(msg, cls = '') {
    clearTimeout(toastTimer);
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + cls;
    toastTimer = setTimeout(() => { t.className = ''; }, 2400);
  }

  init();
</script>
</body>
</html>
